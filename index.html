<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Biblioteca de Prompts</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F0A800">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prompts">

<link rel="apple-touch-icon" href="icons/icon-192.png">

<script>try{var t=localStorage.getItem('bp:theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#EDF0F3;--surface:#fff;--surface-2:#F4F6F8;--ink:#122030;--muted:#566677;--line:#D6DDE4;
  --accent:#F0A800;--accent-ink:#1A1300;--star:#8A5A00;--link:#1D58B8;--danger:#B3261E;--ok:#17703A;--ok-bg:#E3F4E9;
  --mark:#FFE9A8;--mark-blank:#DCE6F5;--scrim:rgba(8,14,22,.5);--shadow:0 10px 40px rgba(18,32,48,.2);
  --font-display:'Bricolage Grotesque',system-ui,sans-serif;
  --font-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1620;--surface:#15212E;--surface-2:#1B2937;--ink:#E8EEF4;--muted:#93A4B5;--line:#273648;
    --accent:#F5B72E;--star:#F5B72E;--link:#7FB1FF;--danger:#FF8F85;--ok:#7BDB9C;--ok-bg:#16301F;
    --mark:#5E4A12;--mark-blank:#25395A;--scrim:rgba(0,0,0,.6);--shadow:0 10px 40px rgba(0,0,0,.5);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1620;--surface:#15212E;--surface-2:#1B2937;--ink:#E8EEF4;--muted:#93A4B5;--line:#273648;
  --accent:#F5B72E;--star:#F5B72E;--link:#7FB1FF;--danger:#FF8F85;--ok:#7BDB9C;--ok-bg:#16301F;
  --mark:#5E4A12;--mark-blank:#25395A;--scrim:rgba(0,0,0,.6);--shadow:0 10px 40px rgba(0,0,0,.5);color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body);
  padding-top:max(20px,env(safe-area-inset-top,0px));padding-bottom:56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
}
.app{max-width:1180px;margin:0 auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-bottom:18px;border-bottom:1px solid var(--line)}
h1{font:700 clamp(26px,4.5vw,36px)/1.1 var(--font-display);letter-spacing:-.01em;margin:0;text-wrap:balance}
.sub{margin:6px 0 0;color:var(--muted);font-size:14px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{
  font:600 14px/1.2 var(--font-body);display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:9px 14px;border-radius:6px;cursor:pointer;text-decoration:none;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);transition:border-color .15s,background .15s;
}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(.95)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.small{padding:6px 10px;font-size:13px}
.btn.icon{padding:9px}
.btn.ok,.btn.primary.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.btn[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.btn:disabled{opacity:.6;cursor:progress}
.btn:focus-visible,.icon-btn:focus-visible,.cat-btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--link);outline-offset:2px}

.banner{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.lock{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 14px;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;background:var(--surface)}
.lock svg{flex:none;color:var(--accent)}
.lock-body{flex:1 1 280px;min-width:0}
.lock-body p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.warn{margin:0;padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);color:var(--muted);font-size:13.5px}

.bar{display:flex;flex-wrap:wrap;gap:10px;padding-block:16px}
.search{flex:1 1 260px;min-width:0}
input[type=text],input[type=search],select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 11px;width:100%;min-width:0}
select{width:auto;padding-right:28px}
textarea{font-family:var(--font-body);font-size:14.5px;line-height:1.55;resize:vertical}
textarea.code{font-family:var(--font-mono);font-size:13px}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.8}

.layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:28px;align-items:start}
.nav-title{margin:0 0 8px 10px;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.cats ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.cat-btn{width:100%;display:flex;justify-content:space-between;align-items:baseline;gap:8px;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;font:inherit;color:var(--ink);cursor:pointer}
.cat-btn:hover{background:var(--surface-2)}
.cat-btn[aria-current="true"]{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font-weight:600}
.cat-btn .n{color:var(--muted);font:400 12px var(--font-mono);font-variant-numeric:tabular-nums}
.sep{height:1px;background:var(--line);margin:6px 10px}

.count{margin:0 0 10px;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:14px}
.card{position:relative;display:flex;flex-direction:column;gap:10px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 14px 10px;transition:border-color .15s}
.card:hover{border-color:var(--muted)}
.card.teaser{border-style:dashed;background:transparent}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tool{font:500 11px var(--font-mono);letter-spacing:0;text-transform:none;border:1px solid var(--line);border-radius:4px;padding:0 5px}
.card h3{margin:0;font:600 18px/1.2 var(--font-display);text-wrap:balance;overflow-wrap:anywhere}
.title-link{all:unset;cursor:pointer}
.title-link::after{content:"";position:absolute;inset:0;border-radius:8px}
.title-link:focus-visible::after{outline:2px solid var(--link);outline-offset:2px}
.snippet{margin:0;font-size:13.5px;line-height:1.55;color:var(--muted);display:-webkit-box;-webkit-line-clamp:4;line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:12.5px;color:var(--muted)}
.card-foot{position:relative;z-index:1;margin-top:auto;display:flex;align-items:center;gap:6px;border-top:1px solid var(--line);padding-top:8px}
.spacer{flex:1}
.uses{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.icon-btn{background:none;border:0;padding:6px;border-radius:6px;cursor:pointer;color:var(--muted);display:inline-flex}
.icon-btn:hover{color:var(--ink);background:var(--surface-2)}
.icon-btn[aria-pressed="true"]{color:var(--star)}
.icon-btn[aria-pressed="true"] svg{fill:currentColor}

.state{border:1px dashed var(--line);border-radius:8px;padding:40px 20px;text-align:center;color:var(--muted)}
.state h2{margin:0 0 6px;font:600 22px var(--font-display);color:var(--ink)}
.state p{margin:0 auto 16px;max-width:46ch}
.state .actions{justify-content:center}

.overlay{position:fixed;inset:0;z-index:20;display:flex;justify-content:flex-end;background:var(--scrim)}
.sheet{
  width:min(640px,100%);height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:16px;
  background:var(--surface);color:var(--ink);box-shadow:var(--shadow);
  padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));
}
.sheet:focus{outline:none}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet h2{margin:4px 0 0;font:700 26px/1.15 var(--font-display);text-wrap:balance;overflow-wrap:anywhere}
.info{margin:0;font-size:13px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
fieldset.vars{margin:0;border:1px solid var(--line);border-radius:8px;padding:12px 14px 14px;display:flex;flex-direction:column;gap:12px;min-width:0}
fieldset.vars legend{padding:0 6px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.vars-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{margin:0;font-size:12.5px;color:var(--muted)}
.err{margin:0;color:var(--danger);font-size:13.5px;font-weight:600}
pre.preview{margin:0;font:15px/1.65 var(--font-body);white-space:pre-wrap;overflow-wrap:anywhere;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:12px 14px;max-height:42vh;overflow:auto}
mark{background:var(--mark);color:var(--ink);border-radius:3px;padding:0 2px}
mark.blank{background:var(--mark-blank)}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}
.note{margin:0;padding:10px 12px;border-radius:6px;background:var(--surface-2);font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.section{display:flex;flex-direction:column;gap:10px;padding-top:14px;border-top:1px solid var(--line)}
.section h3{margin:0;font:600 18px var(--font-display)}
input.key{font:500 18px var(--font-mono);letter-spacing:.06em;text-transform:uppercase}
.toast{position:fixed;left:50%;transform:translateX(-50%);z-index:40;bottom:calc(18px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:6px;font-weight:600;font-size:14px}

@media (max-width:760px){
  .layout{grid-template-columns:minmax(0,1fr);gap:14px}
  .nav-title,.sep{display:none}
  .cats ul{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:6px}
  .cat-btn{width:auto;white-space:nowrap;border:1px solid var(--line);background:var(--surface)}
  .row2{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<noscript><p style="padding:20px">Ative o JavaScript para usar a Biblioteca de Prompts.</p></noscript>

<div class="app" id="app">
  <header class="top">
    <div>
      <h1>Biblioteca de Prompts</h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="actions">
      <button class="btn icon" id="btn-theme" type="button"></button>
      <button class="btn" id="btn-license" type="button" hidden></button>
      <button class="btn" id="btn-backup" type="button">Backup</button>
      <button class="btn primary" id="btn-new" type="button">Novo prompt</button>
    </div>
  </header>
  <div class="banner" id="banner" hidden></div>
  <div class="bar">
    <div class="search">
      <label class="sr" for="q">Buscar prompts</label>
      <input id="q" type="search" placeholder="Buscar por título, texto, tag ou IA   ( / )" autocomplete="off">
    </div>
    <div><label class="sr" for="tool">Filtrar por IA</label><select id="tool"></select></div>
    <div>
      <label class="sr" for="sort">Ordenar por</label>
      <select id="sort">
        <option value="recent">Mais recentes</option>
        <option value="used">Mais usados</option>
        <option value="last">Usados recentemente</option>
        <option value="az">A–Z</option>
      </select>
    </div>
  </div>
  <div class="layout">
    <nav class="cats" id="cats" aria-label="Categorias"></nav>
    <main id="list"></main>
  </div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1"></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="sr" id="live" role="status" aria-live="polite"></div>

  /* ===== backup (só "Meus prompts") ===== */
  function download(name, data) {

  function exportJson() {
    var list = S.mine.map(function (p) { var o = Object.assign({}, p, { fav: mt(p.id).fav, uses: mt(p.id).uses }); delete o.src; return o; });
    /* favoritos e contadores dos prompts da amostra/biblioteca (ids estáveis: s1…, L…) */
    var libMeta = {};
    S.samples.concat(S.lib).forEach(function (p) {
      var m = mt(p.id);
      if (m.fav || m.uses) libMeta[p.id] = { fav: !!m.fav, uses: m.uses };
    });
    return JSON.stringify({ app: 'biblioteca-de-prompts', version: 2, exportedAt: nowIso(), prompts: list, libMeta: libMeta }, null, 2);
  }
  function importData(raw) {
    var data;
    try { data = JSON.parse(raw); } catch (e) { return { error: 'Esse texto não é um backup válido (JSON).' }; }
    var list = Array.isArray(data) ? data : (data && Array.isArray(data.prompts) ? data.prompts : null);
    if (!list) return { error: 'Não encontrei prompts nesse conteúdo.' };
    var added = 0, skipped = 0, keys = Object.create(null), restored = 0;
    function key(p) { return norm(p.title) + '|' + norm(p.text); }
    S.mine.forEach(function (p) { keys[key(p)] = 1; });
    list.slice(0, 2000).forEach(function (x) {
      if (!x || typeof x !== 'object' || !str(x.text).trim()) { skipped++; return; }
      var it = clean(Object.assign({}, x, { id: uid() }), 'mine');
      it.cat = canonCat(it.cat); /* "vendas" e "Vendas" viram a mesma categoria */
      if (keys[key(it)]) { skipped++; return; }
      keys[key(it)] = 1; S.mine.push(it);
      S.meta[it.id] = { fav: !!x.fav, uses: Math.max(0, Number(x.uses) || 0) };
      added++;
    });
    /* restaura favoritos e usos dos prompts da amostra/biblioteca, sem apagar o que já existe aqui */
    var lm = (data && !Array.isArray(data) && data.libMeta && typeof data.libMeta === 'object') ? data.libMeta : null;
    if (lm) Object.keys(lm).slice(0, 500).forEach(function (id) {
      if (!/^(s\d{1,3}|L[\w-]{1,40})$/.test(id) || !lm[id] || typeof lm[id] !== 'object') return;
      var cur = mt(id), uses = Math.max(0, Number(lm[id].uses) || 0), fav = !!lm[id].fav;
      if ((fav && !cur.fav) || uses > cur.uses) {

        restored++;
      }

    return { added: added, skipped: skipped, restored: restored };
  }

        h('h3', { text: 'Onde encontro minha chave?' }),
        h('ol', { style: 'margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:14px' },
          h('li', { text: 'Entre na área de membros da Hotmart com o e-mail da compra.' }),
          h('li', { text: 'Abra a aula “' + CONFIG.keyLesson + '”.' }),
          h('li', { text: 'Copie a chave (16 letras e números) e cole abaixo.' }))),
      h('div', { class: 'field' }, h('label', { for: 'lic-key', text: 'Chave de acesso' }), inp,
        h('p', { class: 'hint', text: 'Pode colar com ou sem os traços. A chave fica salva só neste aparelho, então você não precisa digitar de novo.' })),
      h('div', { class: 'btn-row' }, btn,
        CONFIG.clubUrl ? h('a', { class: 'btn', href: CONFIG.clubUrl, target: '_blank', rel: 'noopener', text: 'Abrir área de membros' }) : null,
        CONFIG.buyUrl ? h('a', { class: 'btn', href: CONFIG.buyUrl, target: '_blank', rel: 'noopener', text: 'Ainda não comprei' }) : null),
      msg);
    mount([head(null, 'Desbloquear biblioteca'), form, support], '#lic-key');
  }

  /* ===== tema ===== */
  var mql = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
  function effTheme() { return document.documentElement.dataset.theme || (mql && mql.matches ? 'dark' : 'light'); }
  function paintTheme() {
    var dark = effTheme() === 'dark', b = $('#btn-theme');
    b.replaceChildren(icon(dark ? 'sun' : 'moon'));
    b.setAttribute('aria-label', dark ? 'Mudar para modo claro' : 'Mudar para modo escuro');
    b.title = dark ? 'Modo claro' : 'Modo escuro';
  }
  $('#btn-theme').addEventListener('click', function () {
    var t = effTheme() === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = t;
    try { localStorage.setItem(K.theme, t); } catch (e) {}
    paintTheme();
  });
  if (mql && mql.addEventListener) mql.addEventListener('change', paintTheme);

  /* ===== eventos ===== */
  var qTimer;
  $('#q').addEventListener('input', function (e) { var v = e.target.value; clearTimeout(qTimer); qTimer = setTimeout(function () { S.q = v; renderList(); }, 120); });
  $('#tool').addEventListener('change', function (e) { S.tool = e.target.value; renderList(); });
  $('#sort').addEventListener('change', function (e) { S.sort = e.target.value; renderList(); });
  $('#btn-new').addEventListener('click', function () { openEdit(null); });
  $('#btn-backup').addEventListener('click', openBackup);
  $('#btn-license').addEventListener('click', openLicense);
  $('#overlay').addEventListener('click', function (e) { if (e.target === e.currentTarget) requestClose(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && S.panel) { requestClose(); return; }
    var tag = (document.activeElement && document.activeElement.tagName) || '';
    if (e.key === '/' && !S.panel && !/INPUT|TEXTAREA|SELECT/.test(tag)) { e.preventDefault(); $('#q').focus(); }
  });

  /* ===== início ===== */
  function readStore() {
    var m = load(K.mine, []), me = load(K.meta, {}), v = load(K.vars, {});
    S.mine = (Array.isArray(m) ? m : []).filter(function (x) { return x && typeof x === 'object'; }).map(function (x) { return clean(x, 'mine'); });
    S.meta = (me && typeof me === 'object' && !Array.isArray(me)) ? me : {};
    S.vars = (v && typeof v === 'object' && !Array.isArray(v)) ? v : {};
    Object.keys(S.vars).forEach(function (k) { if (!canRemember(k)) delete S.vars[k]; });
  }
  function boot() {
    S.samples = SAMPLES.map(function (x) { return clean(Object.assign({ created: D0, updated: D0 }, x), 'sample'); });
    readStore();
    save(K.vars, S.vars);
    /* outra aba mudou os dados: recarrega o estado em vez de sobrescrevê-lo depois */
    addEventListener('storage', function (e) {
      if (e.key !== K.mine && e.key !== K.meta && e.key !== K.vars) return;
      readStore(); render();
    });
    try { S.vault = JSON.parse($('#vault').textContent); } catch (e) { S.vault = null; }
    if (S.vault && (!S.vault.keys || !S.vault.data)) S.vault = null;
    paintTheme();
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().then(function (ok) { S.persisted = ok; }, function () {}); } catch (e) {}
    var lic = load(K.lic, null);
    S.checking = !!(S.vault && lic);
    render();
    if (S.checking) activate(lic).then(finish, function (er) {
      /* chave salva que o cofre não aceita mais (ex.: build novo): limpa e avisa, em vez de ficar bloqueado sem explicação */
      var rejected = /^Chave inválida/.test(str(er));
      if (rejected) drop(K.lic);
      finish();
      if (rejected) toast('Sua licença salva não vale mais neste build. Insira a chave de novo.');
    });
    function finish() { S.checking = false; render(); }
  }
  boot();
})();
</script>
</body>
</html>
